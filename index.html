<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csija</title>
    <link rel="icon" href="./icon-512.png" type="image/png"/>
    <link rel="apple-touch-icon" href="./icon-512.png"/>
    <meta name="apple-mobile-web-app-title" content="Csija"/>
    <link rel="manifest" href="./site.webmanifest"/>
    <meta name="theme-color" content="#121214"/>
    <meta name="description" content="Soothing white, pink, brown and green noise to help your baby fall asleep, with a gentle fadeout timer. Free, works offline, no ads or tracking.">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 25rem;
            text-align: center;
            background: #1c1c1e;
            padding: 0.5rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 0.75rem 2.5rem rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 2.5rem;
            margin: 1rem 0;
            color: #ffffff;
        }
        .noise-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        button {
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            padding: 1rem;
            border-radius: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-noise { background: #2a2a2e; }
        .btn-noise[data-noise="white"] { color: #e1e1e6; }
        .btn-noise[data-noise="pink"]  { color: #ff79c6; }
        .btn-noise[data-noise="brown"] { color: #ffb86c; }
        .btn-noise[data-noise="green"] { color: #50fa7b; }

        .btn-noise.active {
            transform: scale(0.95);
            color: #121214;
        }
        .btn-noise.active[data-noise="white"] { background: #e1e1e6; box-shadow: 0 0 0.9375rem rgba(255,255,255,0.2); }
        .btn-noise.active[data-noise="pink"] { background: #ff79c6; box-shadow: 0 0 0.9375rem rgba(255,121,198,0.3); }
        .btn-noise.active[data-noise="brown"] { background: #ffb86c; box-shadow: 0 0 0.9375rem rgba(255,184,108,0.3); }
        .btn-noise.active[data-noise="green"] { background: #50fa7b; box-shadow: 0 0 0.9375rem rgba(80,250,123,0.3); }

        .control-group {
            background: #26262b;
            padding: 1.2rem;
            border-radius: 1rem;
            margin: 1.5rem 0;
            text-align: left;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a9a9b3;
            margin-bottom: 0.625rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03125rem;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 0.375rem;
            background: #3a3a40;
            border-radius: 0.1875rem;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            background: #9a73ef;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        
        .timer-row {
            display: flex;
            gap: 0.625rem;
        }
        .timer-input {
            background: #3a3a40;
            border: none;
            color: white;
            padding: 0.7rem;
            border-radius: 0.625rem;
            font-size: 1rem;
            width: 6rem;
            text-align: center;
            font-weight: 600;
        }
        .btn-timer {
            flex: 1;
            background: #9a73ef;
            color: white;
            padding: 0.7rem;
            border-radius: 0.625rem;
            font-size: 0.95rem;
        }
        .btn-timer.active {
            background: #6200ee;
        }
        .btn-timer:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>csija</h1>
    
    <div class="noise-grid">
        <button class="btn-noise" data-noise="white">White</button>
        <button class="btn-noise" data-noise="pink">Pink</button>
        <button class="btn-noise" data-noise="brown">Brown</button>
        <button class="btn-noise" data-noise="green">Green</button>
    </div>

    <div class="control-group">
        <label for="volume">Volume <span id="vol-txt">70%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.70">
    </div>

    <div class="control-group">
        <label for="timer-mins"><span id="timer-label">Fadeout Timer</span></label>
        <div class="timer-row">
            <input type="number" id="timer-mins" class="timer-input" min="1" max="240" value="30" list="timer-presets" inputmode="numeric" autocomplete="off">
            <datalist id="timer-presets">
                <option value="5"></option>
                <option value="15"></option>
                <option value="30"></option>
                <option value="60"></option>
                <option value="90"></option>
                <option value="120"></option>
            </datalist>
            <button id="btn-timer" class="btn-timer">Start Timer</button>
        </div>
    </div>

</div>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => console.log(err));
      });
    }

    const noiseButtons = document.querySelectorAll('.btn-noise');
    const volumeSlider = document.getElementById('volume');
    const volTxt = document.getElementById('vol-txt');
    const timerInput = document.getElementById('timer-mins');
    const timerButton = document.getElementById('btn-timer');
    const timerLabel = document.getElementById('timer-label');

    const FADE_SEC = 1.0;
    const MAX_TIMER_MINS = 240;
    const getVolume = () => parseFloat(volumeSlider.value);

    // Web Audio Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (navigator.audioSession) navigator.audioSession.type = 'playback';

    const masterGain = audioCtx.createGain();
    masterGain.gain.value = getVolume();
    masterGain.connect(audioCtx.destination);

    const channels = [0, 1].map(() => {
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0;
        gainNode.connect(masterGain);
        return { gainNode, source: null, fadingSource: null };
    });

    let activeChannelIdx = 0;
    let currentNoiseType = null;
    let lastNoiseType = 'brown';
    let timer = null;
    let suspendTimeout = null;

    // Browsers only expose lock-screen / notification media controls for an
    // HTML media element, so a looping silent clip owns the media session.
    function createSilentWavUrl(seconds) {
        const rate = 8000;
        const samples = rate * seconds;
        const buf = new ArrayBuffer(44 + samples);
        const v = new DataView(buf);
        const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
        str(0, 'RIFF'); v.setUint32(4, 36 + samples, true); str(8, 'WAVE');
        str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
        str(36, 'data'); v.setUint32(40, samples, true);
        new Uint8Array(buf, 44).fill(128);
        return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }

    const keepAlive = new Audio(createSilentWavUrl(10));
    keepAlive.loop = true;
    // Paused by the OS (call, other app, headphones unplugged).
    keepAlive.addEventListener('pause', () => { if (currentNoiseType) stopNoise(); });

    // Mathematical Noise Generators
    function createGenerator(type) {
        if (type === 'white') {
            return () => Math.random() * 2 - 1;
        }
        if (type === 'pink') {
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            return () => {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                const out = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                b6 = white * 0.115926;
                return out;
            };
        }
        if (type === 'brown') {
            let lastOut = 0.0;
            return () => {
                lastOut = (lastOut + 0.02 * (Math.random() * 2 - 1)) / 1.02;
                return lastOut * 3.5;
            };
        }
        // green
        const cutoffHz = 1000;
        const dt = 1.0 / audioCtx.sampleRate;
        const rc = 1.0 / (2.0 * Math.PI * cutoffHz);
        const alpha = rc / (rc + dt);
        let lastBrown = 0.0;
        let lastOutput = 0.0;
        return () => {
            const brown = (lastBrown + 0.02 * (Math.random() * 2 - 1)) / 1.02;
            lastOutput = alpha * (lastOutput + brown - lastBrown);
            lastBrown = brown;
            return lastOutput;
        };
    }

    function createNoiseBuffer(type) {
        const rate = audioCtx.sampleRate;
        const length = 8 * rate;
        const fadeLen = Math.floor(0.5 * rate);
        const next = createGenerator(type);
        const raw = new Float32Array(length + fadeLen);
        for (let i = 0; i < raw.length; i++) raw[i] = next();

        const buffer = audioCtx.createBuffer(1, length, rate);
        const data = buffer.getChannelData(0);
        data.set(raw.subarray(0, length));
        // Crossfade the overrun into the head so the loop point doesn't click.
        for (let i = 0; i < fadeLen; i++) {
            const t = (i / fadeLen) * Math.PI / 2;
            data[i] = raw[i] * Math.sin(t) + raw[length + i] * Math.cos(t);
        }

        if (type === 'green') {
            let peak = 0.0;
            for (let i = 0; i < length; i++) peak = Math.max(peak, Math.abs(data[i]));
            if (peak > 0) for (let i = 0; i < length; i++) data[i] /= peak;
        }
        return buffer;
    }

    const noiseBuffers = {
        white: createNoiseBuffer('white'),
        pink: createNoiseBuffer('pink'),
        brown: createNoiseBuffer('brown'),
        green: createNoiseBuffer('green')
    };

    // Freeze a param at its current value so new automation starts from there.
    function holdParam(param, now) {
        const value = param.value;
        if (param.cancelAndHoldAtTime) {
            param.cancelAndHoldAtTime(now);
        } else {
            param.cancelScheduledValues(now);
        }
        // Without an explicit anchor, a following ramp starts from the last (already finished) event.
        param.setValueAtTime(value, now);
    }

    function rampTo(param, value, now) {
        holdParam(param, now);
        param.linearRampToValueAtTime(value, now + FADE_SEC);
    }

    function releaseChannel(channel, now) {
        if (!channel.source) return;
        rampTo(channel.gainNode.gain, 0, now);
        channel.source.stop(now + FADE_SEC);
        channel.fadingSource = channel.source;
        channel.source = null;
    }

    function killFadingSource(channel) {
        if (!channel.fadingSource) return;
        try { channel.fadingSource.stop(); } catch (e) {}
        channel.fadingSource.disconnect();
        channel.fadingSource = null;
    }

    async function playNoise(type) {
        clearTimeout(suspendTimeout);
        // Must run synchronously inside the user gesture.
        startMediaSession(type);
        if (audioCtx.state !== 'running') {
            await audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        releaseChannel(channels[activeChannelIdx], now);

        activeChannelIdx = 1 - activeChannelIdx;
        const channel = channels[activeChannelIdx];
        // A previous crossfade may still be fading out on this channel.
        killFadingSource(channel);

        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffers[type];
        src.loop = true;
        src.connect(channel.gainNode);
        src.onended = () => src.disconnect();
        src.start(now);
        channel.source = src;

        channel.gainNode.gain.cancelScheduledValues(now);
        channel.gainNode.gain.setValueAtTime(0, now);
        channel.gainNode.gain.linearRampToValueAtTime(1.0, now + FADE_SEC);

        currentNoiseType = type;
        lastNoiseType = type;
        updateUI();
    }

    function stopNoise() {
        if (!currentNoiseType) return;
        const now = audioCtx.currentTime;
        releaseChannel(channels[activeChannelIdx], now);

        clearTimer();
        // Restore the volume only once the channel has faded to silence.
        holdParam(masterGain.gain, now);
        masterGain.gain.setValueAtTime(getVolume(), now + FADE_SEC);

        currentNoiseType = null;
        updateUI();
        stopMediaSession();

        // Release the audio hardware while idle (saves battery overnight).
        suspendTimeout = setTimeout(() => {
            if (!currentNoiseType) audioCtx.suspend();
        }, (FADE_SEC + 0.5) * 1000);
    }

    function updateUI() {
        noiseButtons.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.noise === currentNoiseType);
        });
        timerButton.disabled = !currentNoiseType;
        timerButton.textContent = timer ? 'Cancel Timer' : 'Start Timer';
        timerButton.classList.toggle('active', !!timer);
    }

    // Ramp the master gain from the slider volume (scaled to the time left) down to 0.
    function scheduleFadeRamp(volume) {
        const now = audioCtx.currentTime;
        const remaining = Math.max(0, timer.endTime - now);
        const g = masterGain.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(volume * remaining / timer.duration, now);
        g.linearRampToValueAtTime(0, timer.endTime);
    }

    function updateTimerLabel() {
        const left = Math.max(0, Math.ceil((timer.endMs - Date.now()) / 1000));
        const s = String(left % 60).padStart(2, '0');
        timerLabel.textContent = `Fadeout: ${Math.floor(left / 60)}m ${s}s remaining`;
    }

    function startFadeout(minutes) {
        if (!currentNoiseType) return;
        clearTimer();

        const duration = minutes * 60;
        const now = audioCtx.currentTime;
        timer = {
            duration,
            endTime: now + duration,
            endMs: Date.now() + duration * 1000,
            timeout: setTimeout(stopNoise, duration * 1000),
            interval: setInterval(updateTimerLabel, 1000)
        };
        scheduleFadeRamp(getVolume());
        updateTimerLabel();
        updateUI();
    }

    function clearTimer() {
        if (!timer) return;
        clearTimeout(timer.timeout);
        clearInterval(timer.interval);
        timer = null;
        timerLabel.textContent = 'Fadeout Timer';
    }

    function cancelFadeout() {
        clearTimer();
        rampTo(masterGain.gain, getVolume(), audioCtx.currentTime);
        updateUI();
    }

    function startMediaSession(type) {
        keepAlive.play().catch(() => {});
        if (!('mediaSession' in navigator)) return;
        navigator.mediaSession.metadata = new MediaMetadata({
            title: `${type.charAt(0).toUpperCase() + type.slice(1)} Noise`,
            artist: 'Csija',
            album: 'Csija',
            artwork: [{ src: './icon-512.png', sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.playbackState = 'playing';
    }

    function stopMediaSession() {
        keepAlive.pause();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    }

    if ('mediaSession' in navigator) {
        const noiseTypes = Array.from(noiseButtons, btn => btn.dataset.noise);
        const cycleNoise = (step) => {
            const i = noiseTypes.indexOf(currentNoiseType || lastNoiseType);
            playNoise(noiseTypes[(i + step + noiseTypes.length) % noiseTypes.length]);
        };
        const handlers = {
            play: () => playNoise(lastNoiseType),
            pause: () => stopNoise(),
            stop: () => stopNoise(),
            nexttrack: () => cycleNoise(1),
            previoustrack: () => cycleNoise(-1)
        };
        for (const [action, handler] of Object.entries(handlers)) {
            try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {}
        }
    }

    // Event Triggers
    noiseButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const noiseType = btn.dataset.noise;
            if (currentNoiseType === noiseType) {
                stopNoise();
            } else {
                playNoise(noiseType);
            }
        });
    });

    volumeSlider.addEventListener('input', () => {
        const val = getVolume();
        volTxt.textContent = `${Math.round(val * 100)}%`;
        if (timer) {
            scheduleFadeRamp(val);
        } else {
            holdParam(masterGain.gain, audioCtx.currentTime);
            masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.01);
        }
    });

    timerButton.addEventListener('click', () => {
        if (timer) {
            cancelFadeout();
            return;
        }
        const mins = Math.min(parseFloat(timerInput.value), MAX_TIMER_MINS);
        if (!(mins > 0)) return;
        timerInput.value = mins;
        startFadeout(mins);
    });

    updateUI();
</script>
</body>
</html>
